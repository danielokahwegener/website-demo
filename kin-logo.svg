<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" fill="none">
  <!-- Arc -->
  <path d="M 60 110 Q 150 10 240 110" stroke="#e8e3d6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Star/sparkle at top of arc -->
  <g transform="translate(150, 28)">
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#e8e3d6" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#e8e3d6" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="#e8e3d6" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="#e8e3d6" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  <!-- KIN text -->
  <text x="150" y="145" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="44" font-weight="400" fill="#e8e3d6" text-anchor="middle" letter-spacing="18">KIN</text>
</svg>
